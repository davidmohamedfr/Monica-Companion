# ============================================
# RELEASE STAGE - Production builds
# ============================================
release:
  stage: release
  timeout: 20 minutes
  # No dependency on test job - tags are created from tested commits on dev/main
  # Tests are still run inline below as final validation before release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "🚀 Building release artifacts for $CI_COMMIT_TAG..."
    - flutter pub get

    # Run tests before release
    - echo "🧪 Running tests..."
    - flutter test

    # Build release APK only
    - echo "🔨 Building release APK..."
    - flutter build apk --release

    # Prepare artifacts with version naming
    - echo "📦 Preparing release artifacts..."
    - cd build/app/outputs/flutter-apk
    - mv app-release.apk monica-companion-$CI_COMMIT_TAG.apk
    - sha256sum monica-companion-$CI_COMMIT_TAG.apk > monica-companion-$CI_COMMIT_TAG.apk.sha256
    - cat monica-companion-$CI_COMMIT_TAG.apk.sha256
    - cd -

    # Upload to Generic Package Registry for direct download
    - echo "📤 Uploading to Package Registry..."
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file build/app/outputs/flutter-apk/monica-companion-$CI_COMMIT_TAG.apk
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/monica-companion/${CI_COMMIT_TAG}/monica-companion-${CI_COMMIT_TAG}.apk"
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file build/app/outputs/flutter-apk/monica-companion-$CI_COMMIT_TAG.apk.sha256
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/monica-companion/${CI_COMMIT_TAG}/monica-companion-${CI_COMMIT_TAG}.apk.sha256"
    - echo "✅ Uploaded to: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/monica-companion/${CI_COMMIT_TAG}/"

    # Cleanup old releases (keep last 2) - Skip for now to avoid complexity
    - echo "🧹 Release cleanup skipped - manual cleanup recommended"
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/monica-companion-$CI_COMMIT_TAG.apk
      - build/app/outputs/flutter-apk/monica-companion-$CI_COMMIT_TAG.apk.sha256
    name: "monica-companion-$CI_COMMIT_TAG"
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Monica Companion - Release $CI_COMMIT_TAG

      **Build Information:**
      - Built from commit: `$CI_COMMIT_SHA`
      - Build date: $CI_COMMIT_TIMESTAMP
      - Flutter version: $FLUTTER_VERSION
      - Pipeline: $CI_PIPELINE_URL

      ## Installation Instructions

      ### From APK (Recommended)
      1. Download the APK file below: `monica-companion-$CI_COMMIT_TAG.apk`
      2. Verify checksum (optional): Download `.sha256` file and compare
      3. Enable "Install from Unknown Sources" in Android settings
      4. Install the APK on your device

      ### Checksum Verification
      ```bash
      sha256sum -c monica-companion-$CI_COMMIT_TAG.apk.sha256
      ```

      ## Changes
      See commit history for detailed changes since last release.
    assets:
      links:
        - name: "monica-companion-$CI_COMMIT_TAG.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/monica-companion/${CI_COMMIT_TAG}/monica-companion-${CI_COMMIT_TAG}.apk"
          link_type: package
        - name: "monica-companion-$CI_COMMIT_TAG.apk.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/monica-companion/${CI_COMMIT_TAG}/monica-companion-${CI_COMMIT_TAG}.apk.sha256"
          link_type: other
