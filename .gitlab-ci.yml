# GitLab CI/CD Pipeline for Monica-Companion
# Migrated from GitHub Actions workflows (push.yml, PR.yml, release.yml)

# Workflow rules: Control when pipelines are created
workflow:
  auto_cancel:
    on_new_commit: interruptible # Cancel old pipelines on new commit
  rules:
    # Run on tags (highest priority)
    - if: "$CI_COMMIT_TAG"
    # Run on push to dev or main (these are branch pipelines)
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Run MR pipeline (detached pipeline for merge requests)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - prepare
  - lint
  - test
  - build
  - integration_test
  - release

# Use Flutter Docker image for shared runners
image: ghcr.io/cirruslabs/flutter:3.35.4

variables:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.35.4"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

# Global cache configuration
cache:
  key:
    files:
      - pubspec.yaml
      - pubspec.lock
  paths:
    - .pub-cache/
    - .dart_tool/

# ============================================
# PREPARE STAGE - Warm caches
# ============================================
prepare:
  stage: prepare
  timeout: 15 minutes
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Installing Flutter $FLUTTER_VERSION..."
    - flutter --version
    - flutter pub get
    - flutter pub deps
    - dart analyze --no-fatal-warnings . || true
    - dart format --output=none . || true
  cache:
    key: flutter-$FLUTTER_VERSION-$CI_RUNNER_ID
    paths:
      - .pub-cache/
      - .dart_tool/
  artifacts:
    paths:
      - .dart_tool/package_config.json
    expire_in: 1 hour

# ============================================
# LINT STAGE - Code quality checks
# ============================================
lint:
  stage: lint
  timeout: 10 minutes
  interruptible: true
  needs:
    - prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # Get dependencies first
    - flutter pub get

    # Formatting check
    - echo "🎨 Checking code formatting..."
    - dart format --output=none --set-exit-if-changed .

    # Analysis
    - echo "🔍 Running static analysis..."
    - dart analyze --no-fatal-warnings

    # Validate configuration
    - echo "📋 Validating analysis_options.yaml..."
    - test -f analysis_options.yaml || (echo "❌ analysis_options.yaml missing" && exit 1)

    # Check unused dependencies
    - echo "📦 Checking for unused dependencies..."
    - flutter pub deps --json | jq '.packages[] | select(.kind == "direct") | .name' > used_deps.txt || true
    - grep -r "import 'package:" lib/ | sed "s/.*package:\([^\/]*\).*/\1/" | sort -u > imported_deps.txt || true

    # Check outdated dependencies
    - echo "🔄 Checking for outdated dependencies..."
    - flutter pub outdated --exit-code || true

    # Security audit
    - echo "🔒 Running security audit..."
    - dart pub audit || true

    # Security scan for hardcoded secrets
    - echo "🔐 Scanning for hardcoded secrets..."
    - grep -rE "api_key\s*=\s*['\"][^'\"]+['\"]" lib/ --include="*.dart" && echo "❌ Hardcoded API key found" && exit 1 || true
    - grep -rE "password\s*=\s*['\"][^'\"]+['\"]" lib/ --include="*.dart" && echo "❌ Hardcoded password found" && exit 1 || true
    - grep -r "print(" lib/ --include="*.dart" && echo "❌ Debug print statements found in lib/" && exit 1 || true

    # Documentation check
    - echo "📚 Checking documentation..."
    - test -f README.md || (echo "❌ README.md missing" && exit 1)
    - test -f LICENSE || (echo "❌ LICENSE missing" && exit 1)
    - test -f SECURITY.md || (echo "❌ SECURITY.md missing" && exit 1)
    - test -f PRIVACY.md || (echo "❌ PRIVACY.md missing" && exit 1)

    # File structure validation
    - echo "📁 Validating project structure..."
    - test -d lib || (echo "❌ lib/ directory missing" && exit 1)
    - test -d test || (echo "❌ test/ directory missing" && exit 1)
    - test -d integration_test || (echo "❌ integration_test/ directory missing" && exit 1)
    - test -f test/helpers/test_helpers.dart || (echo "❌ test/helpers/test_helpers.dart missing" && exit 1)
  allow_failure:
    exit_codes:
      - 1

# ============================================
# TEST STAGE - Unit and widget tests
# ============================================
test:
  stage: test
  timeout: 15 minutes
  interruptible: true
  needs:
    - prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "🧪 Running unit and widget tests..."
    - flutter pub get
    - flutter test --coverage --test-randomize-ordering-seed random

    # Calculate coverage percentage
    - test -f coverage/lcov.info && total_lines=$(grep -E "^DA:" coverage/lcov.info | wc -l) || total_lines=0
    - test -f coverage/lcov.info && covered_lines=$(grep -E "^DA:" coverage/lcov.info | grep -E ",1$|,[2-9][0-9]*$" | wc -l) || covered_lines=0
    - test $total_lines -gt 0 && coverage=$((covered_lines * 100 / total_lines)) || coverage=0
    - test $total_lines -gt 0 && echo "📊 Test coverage: ${coverage}%" || echo "No coverage data"
    - test $coverage -lt 60 && test $total_lines -gt 0 && echo "⚠️ Warning: Test coverage is below 60%" || true
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/lcov.info
    expire_in: 7 days
  coverage: '/Test coverage: \d+%/'

# ============================================
# BUILD STAGE - Build debug APK
# ============================================
build_apk:
  stage: build
  timeout: 15 minutes
  interruptible: true
  needs:
    - prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "🔨 Building debug APK..."
    - flutter pub get
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 day

