name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.35.4"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: Analyze project source
      run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Tests & Coverage
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run tests
      run: flutter test --coverage --test-randomize-ordering-seed random

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

    - name: Check test coverage
      run: |
        if [ -f coverage/lcov.info ]; then
          total_lines=$(grep -E "^DA:" coverage/lcov.info | wc -l)
          covered_lines=$(grep -E "^DA:" coverage/lcov.info | grep -E ",1$|,[2-9][0-9]*$" | wc -l)
          if [ $total_lines -gt 0 ]; then
            coverage=$((covered_lines * 100 / total_lines))
            echo "Test coverage: ${coverage}%"
            if [ $coverage -lt 60 ]; then
              echo "Warning: Test coverage is below 60%"
            fi
          fi
        fi

  integration_test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: AVD cache
      uses: actions/cache@v3
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api-level-30
        
    - name: Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."
        
    - name: Run integration tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        target: google_apis
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: flutter test integration_test/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [lint, test, integration_test]
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=MIN_SDK_VERSION=24

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7

    - name: Verify APK size
      run: |
        APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk)
        APK_SIZE_MB=$((APK_SIZE / 1048576))
        echo "APK size: ${APK_SIZE_MB} MB"
        if [ $APK_SIZE_MB -gt 100 ]; then
          echo "Warning: APK size exceeds 100 MB"
        fi

  integration:
    name: All Checks Passed
    needs: [lint, test, build-android]
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: All checks passed
      run: |
        echo "✅ All CI checks passed successfully"
        echo "- Linting: Passed"
        echo "- Tests: Passed"
        echo "- Android Build: Passed"