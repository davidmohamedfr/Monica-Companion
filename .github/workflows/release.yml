name: Release

on:
  push:
    tags:
      - '*'

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.35.4"

jobs:
  release:
    name: Create Release
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: false
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run tests
      run: flutter test
      
    - name: Build release APK
      run: flutter build apk --release

    - name: Prepare release artifacts
      run: |
        cd build/app/outputs/flutter-apk
        mv app-release.apk monica-companion-${{ github.ref_name }}.apk
        sha256sum monica-companion-${{ github.ref_name }}.apk > monica-companion-${{ github.ref_name }}.apk.sha256
        cat monica-companion-${{ github.ref_name }}.apk.sha256

    - name: Create Release with APK
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## Monica Companion - Release ${{ github.ref_name }}

          **Build Information:**
          - Built from commit: `${{ github.sha }}`
          - Build date: ${{ github.event.head_commit.timestamp }}
          - Flutter version: ${{ env.FLUTTER_VERSION }}

          ## Installation Instructions

          ### From APK (Recommended)
          1. Download the APK file below: `monica-companion-${{ github.ref_name }}.apk`
          2. Verify checksum (optional): Download `.sha256` file and compare
          3. Enable "Install from Unknown Sources" in Android settings
          4. Install the APK on your device

          ### Checksum Verification
          ```bash
          sha256sum -c monica-companion-${{ github.ref_name }}.apk.sha256
          ```

          ## Changes
          See commit history for detailed changes since last release.
        files: |
          build/app/outputs/flutter-apk/monica-companion-${{ github.ref_name }}.apk
          build/app/outputs/flutter-apk/monica-companion-${{ github.ref_name }}.apk.sha256
        fail_on_unmatched_files: true

    - name: Cleanup old releases
      if: success()
      run: ./scripts/cleanup_old_releases.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}