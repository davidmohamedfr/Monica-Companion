name: Code Analysis and Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  analyze:
    name: Analyze and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}'

      - name: Verify Flutter version
        run: |
          flutter --version
          if ! flutter --version | grep -q "${{ env.FLUTTER_VERSION }}"; then
            echo "Error: Expected Flutter version ${{ env.FLUTTER_VERSION }}"
            exit 1
          fi
          echo "✅ Flutter version ${{ env.FLUTTER_VERSION }} verified"

      - name: Check if Flutter project exists
        id: flutter-check
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_project=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_project=false" >> $GITHUB_OUTPUT
            echo "No pubspec.yaml found - Flutter project not initialized yet"
          fi
        
      - name: Get dependencies
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: flutter pub get
        
      - name: Verify formatting
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: dart format --output=none --set-exit-if-changed .
        
      - name: Analyze project source
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: dart analyze --fatal-infos --fatal-warnings
        
      - name: Run custom lints
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: flutter analyze
        
      - name: Validate linting configuration
        run: |
          echo "Validating analysis_options.yaml exists..."
          if [ -f "analysis_options.yaml" ]; then
            echo "✅ analysis_options.yaml found"
          else
            echo "❌ analysis_options.yaml missing"
            exit 1
          fi
        
      - name: Check for outdated dependencies
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: flutter pub outdated --exit-code
        continue-on-error: true
        
      - name: Pub audit for security vulnerabilities
        if: steps.flutter-check.outputs.flutter_project == 'true'
        run: dart pub deps --json | dart pub audit
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}'

      - name: Verify Flutter version
        run: |
          flutter --version
          if ! flutter --version | grep -q "${{ env.FLUTTER_VERSION }}"; then
            echo "Error: Expected Flutter version ${{ env.FLUTTER_VERSION }}"
            exit 1
          fi
          echo "✅ Flutter version ${{ env.FLUTTER_VERSION }} verified"

      - name: Check if Flutter project exists
        id: flutter-check-test
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_project=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_project=false" >> $GITHUB_OUTPUT
            echo "No pubspec.yaml found - skipping tests until Flutter project is initialized"
          fi
          
      - name: Get dependencies
        if: steps.flutter-check-test.outputs.flutter_project == 'true'
        run: flutter pub get
        
      - name: Run unit tests
        if: steps.flutter-check-test.outputs.flutter_project == 'true'
        run: flutter test --coverage
        
      - name: Generate coverage report
        if: steps.flutter-check-test.outputs.flutter_project == 'true'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=lib
        
      - name: Upload coverage to Codecov
        if: steps.flutter-check-test.outputs.flutter_project == 'true'
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}'

      - name: Verify Flutter version
        run: |
          flutter --version
          if ! flutter --version | grep -q "${{ env.FLUTTER_VERSION }}"; then
            echo "Error: Expected Flutter version ${{ env.FLUTTER_VERSION }}"
            exit 1
          fi
          echo "✅ Flutter version ${{ env.FLUTTER_VERSION }} verified"

      - name: Check if Flutter project exists
        id: flutter-check-build
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "flutter_project=true" >> $GITHUB_OUTPUT
          else
            echo "flutter_project=false" >> $GITHUB_OUTPUT
            echo "No pubspec.yaml found - skipping build until Flutter project is initialized"
          fi
          
      - name: Get dependencies
        if: steps.flutter-check-build.outputs.flutter_project == 'true'
        run: flutter pub get
        
      - name: Build APK
        if: steps.flutter-check-build.outputs.flutter_project == 'true'
        run: flutter build apk --debug
        
      - name: Upload APK artifact
        if: steps.flutter-check-build.outputs.flutter_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7