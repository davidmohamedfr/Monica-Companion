# Monica Companion - Comprehensive Testing Strategy
# Ensures quality at every stage: commit → push → PR

# Pre-commit: Quality checks before any commit
pre-commit:
  parallel: true
  commands:
    # 1. Format check and auto-fix
    dart-format:
      tags: quality
      glob: "**/*.dart"
      run: dart format {staged_files} && git add {staged_files}
      stage_fixed: true
      fail_text: |
        ❌ Code formatting issues found!
        💡 Files have been auto-formatted and staged

    # 2. Comprehensive lint analysis (errors only)
    dart-analyze:
      tags: quality
      run: dart analyze --no-fatal-warnings
      fail_text: |
        ❌ Lint analysis failed!
        💡 Fix all errors before committing

    # 3. Check for debugging statements
    no-debug-prints:
      tags: quality
      glob: "lib/**/*.dart"
      run: |
        if grep -r "print(" lib/ --include="*.dart" 2>/dev/null; then
          echo "❌ Found print() statements in lib/ directory"
          echo "💡 Remove or replace with proper logging before committing"
          exit 1
        fi
        if grep -r "debugPrint(" lib/ --include="*.dart" 2>/dev/null; then
          echo "❌ Found debugPrint() statements in lib/ directory"
          echo "💡 Remove or replace with proper logging before committing"
          exit 1
        fi
        echo "✅ No debugging statements found"

    # 4. Verify dependencies
    deps-check:
      tags: quality
      run: ./scripts/flutter_with_env.sh pub deps --json > /dev/null
      fail_text: |
        ❌ Dependency issues found!
        💡 Run 'flutter pub get' to resolve dependencies

# Pre-push: Unit tests before any push
pre-push:
  parallel: false
  exclude_tags:
    - heavy-test
  commands:
    # 0. Warm up Flutter tool
    flutter-warmup:
      tags: test
      run: ./scripts/flutter_with_env.sh --version > /dev/null 2>&1 || true

    # 1. Ensure dependencies are up to date
    pub-get:
      tags: test
      run: ./scripts/flutter_with_env.sh pub get

    # 2. Run all unit and widget tests
    unit-tests:
      tags: test
      run: ./scripts/flutter_with_env.sh test --coverage --reporter=expanded
      fail_text: |
        ❌ Unit tests failed!
        💡 Fix failing tests before pushing

    # 3. Verify test coverage
    coverage-check:
      tags: test
      run: |
        if [ -f "coverage/lcov.info" ]; then
          echo "✅ Test coverage report generated at coverage/lcov.info"
          # Optional: Add coverage threshold check here
        else
          echo "⚠️  No coverage report found - ensure tests are running properly"
        fi

    # 4. Run integration tests locally
    integration-tests:
      tags: heavy-test
      run: |
        echo "🧪 Running integration tests..."
        chmod +x scripts/run_integration_tests.sh
        ./scripts/run_integration_tests.sh
      fail_text: |
        ❌ Integration tests failed!
        💡 Fix failing integration tests before pushing

# Commit message quality
commit-msg:
  commands:
    conventional-commit:
      skip:
        - run: test -f lefthook-local.yml
          reason: "Using local commit message validation"
      run: |
        # Check for conventional commit format
        if ! head -n1 {1} | grep -qE "^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: .+"; then
          echo "❌ Commit message should follow conventional commit format:"
          echo "   feat: add new feature"
          echo "   fix: resolve bug"
          echo "   docs: update documentation"
          echo "   test: add tests"
          echo "   refactor: improve code structure"
          echo "   style: format code"
          echo "   chore: maintenance tasks"
          exit 1
        fi

post-merge:
  commands:
    # Update IDE configurations after pull
    update-ide-config:
      run: |
        echo "Updating IDE configurations..."
        # Ensure VS Code settings are applied
        if [ -f ".vscode/settings.json" ]; then
          echo "VS Code settings updated"
        fi
        # Ensure Android Studio settings are applied
        if [ -d ".idea" ]; then
          echo "Android Studio settings updated"
        fi
        echo "Linting configuration deployed successfully"

post-checkout:
  commands:
    # Check for Flutter dependencies after branch switch
    flutter-deps:
      run: |
        if [ -f "pubspec.yaml" ]; then
          echo "Getting Flutter dependencies..."
          ./scripts/flutter_with_env.sh pub get || echo "Flutter not available, skipping pub get"
        fi

# Output configuration for better UX
output:
  - meta
  - summary
  - success
  - failure

# Skip configuration for emergency situations
skip_output:
  - meta
  - skips
# Instructions for team members
#
# USAGE:
# - Normal workflow: hooks run automatically
# - Skip all hooks: LEFTHOOK=0 git commit -m "emergency fix"
# - Skip specific hook: LEFTHOOK=0 git push
# - Run manually: lefthook run pre-commit
#
# SETUP FOR NEW TEAM MEMBERS:
# 1. Install lefthook: brew install lefthook (or appropriate package manager)
# 2. Install hooks: lefthook install
# 3. First time: flutter pub get
#
# TESTING STAGES:
# 📝 pre-commit: Format, lint, debug checks, dependencies
# 🧪 pre-push: Unit tests, integration tests, coverage
# 🚀 CI: Lint, unit tests, build verification (integration tests run locally)
