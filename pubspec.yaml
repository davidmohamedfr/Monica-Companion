name: monica_companion
description: Monica Companion - Personal relationships, perfectly managed
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies for future implementation
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1

  # Database dependencies
  sqflite: ^2.3.0
  path: ^1.8.3

  # Contact list dependencies
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  flutter_bloc: ^8.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Development and testing tools
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  mocktail: ^1.0.0
  bloc_test: ^9.1.5
  
  # Code generation (for future use)
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/logos/
  
